syntax = "proto3";

package qubic.stats.api.pb;

option go_package = "github.com/qubic/qubic-stats-api/protobuff/";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

message QubicData {
  int64 timestamp = 1;
  int64 circulating_supply = 2;
  int32 active_addresses = 3;
  float price = 4;
  int64 market_cap = 5;
  uint32 epoch = 6;
  uint32 current_tick = 7;
  uint32 ticks_in_current_epoch = 8;
  uint32 empty_ticks_in_current_epoch = 9;
  float epoch_tick_quality = 10;
  uint64 burned_qus = 11;
  uint32 ticks_in_last10000 = 12;
  uint32 empty_ticks_in_last10000 = 13;
  float last10000_tick_quality = 14;
}

// Pagination

message Pagination {
  int32 total_records = 1;
  int32 current_page = 2;
  int32 total_pages = 3;
  int32 page_size = 4;
}

// Rich list types

message RichListEntity {
  string identity = 1;
  int64 balance = 2;
}

message RichList {
  repeated RichListEntity entities = 1;
}

message GetRichListSliceRequest {
  int32 page = 1;

  // Value must be between 1 and 100
  int32 page_size = 2;

}

message GetRichListSliceResponse {
  Pagination pagination = 1;
  uint32 epoch = 2;
  RichList rich_list = 3;
}

// asset owners

message GetAssetOwnershipRequest {
  string issuer_identity = 1;
  string asset_name = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message GetAssetOwnershipResponse {
  Pagination pagination = 1;
  uint32 tick = 2;
  repeated AssetOwnership owners = 3;
}

message AssetOwnership {
  string identity = 1;
  int64 number_of_shares = 2;
}

//Latest data

message GetLatestDataResponse {
  QubicData data = 1;
}

// Supply history

message SupplyHistoryPoint {
  uint32 epoch = 1;
  // Circulating supply at the end of this epoch, as measured by the spectrum file that was dumped
  // at the transition into the next one.
  int64 circulating_supply = 2;
  // Cumulative issuance up to and including this epoch.
  int64 total_emitted = 3;
  // When this epoch closed, in unix seconds. Display only.
  int64 timestamp = 4;
  // How the supply of this point was obtained. "spectrum" and "derived" are measured values,
  // "carried-over" means that no spectrum file could be attributed to this epoch and the supply of
  // an earlier one is repeated, which shows up as an epoch without any burn.
  string supply_source = 5;
}

message GetSupplyHistoryRequest {
  // Inclusive. Defaults to the earliest available epoch.
  uint32 from_epoch = 1;
  // Inclusive. Defaults to the latest available epoch.
  uint32 to_epoch = 2;
  // Maximum number of points. The most recent ones are kept when the range holds more.
  int32 limit = 3;
}

message GetSupplyHistoryResponse {
  // Maximum amount of QUs that can ever exist. Constant, for a reference line.
  int64 supply_cap = 1;
  uint32 current_epoch = 2;
  int64 current_circulating_supply = 3;
  // Ordered by epoch ascending.
  repeated SupplyHistoryPoint points = 4;
}

service StatsService {

  // Returns the latest available chain information.
  rpc GetLatestData(google.protobuf.Empty) returns (GetLatestDataResponse) {
    option (google.api.http) = {
      get: "/v1/latest-stats"
    };
  };

  // Returns the list of top holders in the Qubic network.
  rpc GetRichListSlice(GetRichListSliceRequest) returns (GetRichListSliceResponse) {
    option (google.api.http) = {
      get: "/v1/rich-list"
    };
  };

  rpc GetAssetOwners(GetAssetOwnershipRequest) returns (GetAssetOwnershipResponse) {
    option (google.api.http) = {
      get: "/v1/issuers/{issuer_identity}/assets/{asset_name}/owners"
    };
  };

  // Returns the circulating supply per epoch, one point per completed epoch, ordered by epoch
  // ascending. The epoch in progress is reported separately as current_epoch.
  rpc GetSupplyHistory(GetSupplyHistoryRequest) returns (GetSupplyHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/supply-history"
    };
  };

}
