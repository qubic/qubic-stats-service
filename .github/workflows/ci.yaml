name: CI

# Runs vet, tests and govulncheck for every module touched by a push or PR.
# The `ci-ok` job always reports and is the single required status check on main.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.10'
  GOVULNCHECK_VERSION: 'v1.9.0'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # module dir => space separated path prefixes that affect it
          declare -A MODULES=(
            [api]="api/"
            [processor]="processor/"
          )

          select_all() { printf '%s\n' "${!MODULES[@]}"; }

          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            selected=$(select_all)
          else
            if [ "$EVENT" = "pull_request" ]; then
              base="$PR_BASE"
            elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)
            else
              base="$PUSH_BEFORE"
            fi

            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              selected=$(select_all)
            else
              changed=$(git diff --name-only "$base" HEAD)
              selected=""
              for mod in "${!MODULES[@]}"; do
                for prefix in ${MODULES[$mod]}; do
                  if grep -q "^${prefix}" <<< "$changed"; then
                    selected+="$mod"$'\n'
                    break
                  fi
                done
              done
            fi
          fi

          modules=$(printf '%s' "$selected" | sed '/^$/d' | sort | jq -R . | jq -cs .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Modules to check: $modules"

  check:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    name: check (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -p 1 -tags ci ./...
      - name: Vulnerability check
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  ci-ok:
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          echo "changes=$CHANGES_RESULT check=$CHECK_RESULT"
          [ "$CHANGES_RESULT" = "success" ] || exit 1
          case "$CHECK_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
